<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Precios - Manantial</title>
  <link rel="stylesheet" href="styles.css?v=20261018d">
</head>
<body>
  <header class="topbar">
    <div class="encabezado">
      <div class="marca" role="img" aria-label="Manantial Almacén">
        <span class="marca-gota"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2.6c3.6 4.7 6.1 7.8 6.1 11.1a6.1 6.1 0 0 1-12.2 0c0-3.3 2.5-6.4 6.1-11.1z" fill="currentColor"/><path d="M9.2 14.2a3 3 0 0 0 2.4 2.9" fill="none" stroke="#e9b9c0" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        <span class="marca-texto"><span class="marca-nombre">Manantial</span><span class="marca-sub">Almacén</span></span>
      </div>
      <div class="titulo">
        <h1>Lista de Precios</h1>
        <small id="actualizado"></small>
      </div>
    </div>
    <input id="buscar" type="search" placeholder="Buscar producto…" autocomplete="off">
    <div class="acciones">
      <button id="btnImprimir" class="btn visitante-only">🖨️ Imprimir</button>
      <button id="btnAdmin" class="btn visitante-only">🔒 Editar</button>
      <button id="btnEditar" class="btn primario admin-only">✏️ Editar</button>
      <button id="btnSalir" class="btn admin-only">🔓 Cerrar Sesión Editor</button>
      <button id="btnMenu" class="btn admin-only">⋯ Más</button>
      <div id="menu" class="menu" hidden>
        <button data-accion="porcentaje">📈 Ajustar precios por %</button>
        <button data-accion="categorias">🗂️ Administrar categorías</button>
        <button data-accion="imprimir">🖨️ Imprimir / PDF</button>
        <button data-accion="csv">📄 Descargar para Excel (CSV)</button>
        <button data-accion="respaldo">💾 Guardar copia de seguridad</button>
        <button data-accion="restaurar">📂 Restaurar copia de seguridad</button>
        <button data-accion="reiniciar" class="peligro">♻️ Volver al catálogo original</button>
        <button data-accion="salir">🔓 Salir de administrador</button>
      </div>
      <input id="archivoRespaldo" type="file" accept=".json" hidden>
    </div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <main>
    <p id="aviso" class="aviso" hidden>Modo edición: tocá cualquier campo para cambiarlo. Se guarda solo.</p>
    <div class="tabla-scroll">
    <table id="tabla">
      <thead>
        <tr>
          <th class="c-nombre"><button type="button" class="orden" data-orden="nombre" title="Ordenar de la A a la Z">Producto <span class="flecha">⇅</span></button></th>
          <th class="c-precio"><button type="button" class="orden" data-orden="mayorista" title="Ordenar por Mayorista">Mayorista <span class="flecha">⇅</span></button></th>
          <th class="c-precio"><button type="button" class="orden" data-orden="minorista" title="Ordenar por Minorista">Minorista <span class="flecha">⇅</span></button></th>
          <th class="c-nota">Comentario</th>
          <th class="c-acc edit-only"></th>
        </tr>
      </thead>
      <tbody id="cuerpo"></tbody>
    </table>
    </div>
    <p id="vacio" class="vacio" hidden>No hay productos para mostrar.</p>
    <button id="btnAgregar" class="btn primario agregar edit-only">➕ Agregar producto</button>
  </main>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script src="datos.js?v=20261018d"></script>
  <script src="app.js?v=20261018d"></script>
</body>
</html>
