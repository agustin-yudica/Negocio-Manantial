<meta name="claude:viewport-fit-sides" content="cover">
<title>Lista Manantial</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Lista de precios mayorista/minorista. Bordó sobre crema, tipografía serif para títulos. */
  :root {
    --bg: #f8f7f1;
    --card: #ffffff;
    --campo: #ffffff;
    --texto: #2b1a1c;
    --suave: #7a6a6c;
    --linea: #e8e3d8;
    --acento: #722f37;
    --acento-fondo: #722f37;
    --sobre-acento: #ffffff;
    --mayo: #f6ecec;
    --mino: #f2efe4;
    --fila-cat: #efe9dd;
    --peligro: #b3261e;
    --aviso-bg: #fff7d6;
    --aviso-borde: #ecd978;
    --sombra: rgba(0,0,0,.18);
    --serif: "Fraunces", Georgia, serif;
    --sans: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1416; --card: #271b1e; --campo: #1f1517; --texto: #f4ecec; --suave: #b9a5a8;
      --linea: #3b2b2f; --acento: #e3a3ab; --acento-fondo: #8e3b46; --sobre-acento: #ffffff;
      --mayo: #33232a; --mino: #2e2a22; --fila-cat: #31262a; --peligro: #ff8a80;
      --aviso-bg: #3a3320; --aviso-borde: #6b5d2a; --sombra: rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1416; --card: #271b1e; --campo: #1f1517; --texto: #f4ecec; --suave: #b9a5a8;
    --linea: #3b2b2f; --acento: #e3a3ab; --acento-fondo: #8e3b46; --sobre-acento: #ffffff;
    --mayo: #33232a; --mino: #2e2a22; --fila-cat: #31262a; --peligro: #ff8a80;
    --aviso-bg: #3a3320; --aviso-borde: #6b5d2a; --sombra: rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--texto); font-family: var(--sans); font-size: 17px; }
  .envoltorio { max-width: 980px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

  header.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); border-bottom: 1px solid var(--linea); }
  header.barra .envoltorio { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 10px; }
  .titulo { min-width: 0; }
  .titulo h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 1.45rem; color: var(--acento); }
  .titulo small { color: var(--suave); font-size: .8rem; }
  #buscar { flex: 1 1 200px; min-width: 0; padding: 10px 12px; font: inherit; font-size: 1rem; border: 1px solid var(--linea); border-radius: 12px; background: var(--campo); color: var(--texto); }
  .acciones { position: relative; display: flex; gap: 8px; flex-wrap: wrap; }

  .btn { padding: 10px 14px; font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer; border: 1px solid var(--linea); border-radius: 12px; background: var(--card); color: var(--acento); }
  .btn:hover { background: var(--mayo); }
  .btn.primario { background: var(--acento-fondo); color: var(--sobre-acento); border-color: var(--acento-fondo); }
  .btn.primario:hover { filter: brightness(1.1); }
  .btn:focus-visible, .tab:focus-visible, .orden:focus-visible, td input:focus-visible, td select:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .menu { position: absolute; right: 0; top: 46px; z-index: 20; display: flex; flex-direction: column; min-width: 260px; background: var(--card); border: 1px solid var(--linea); border-radius: 12px; box-shadow: 0 8px 24px var(--sombra); overflow: hidden; }
  .menu button { text-align: left; padding: 12px 14px; font: inherit; font-size: .95rem; color: var(--texto); border: 0; border-bottom: 1px solid var(--linea); background: none; cursor: pointer; }
  .menu button:last-child { border-bottom: 0; }
  .menu button:hover { background: var(--mayo); }

  .tabs { display: flex; gap: 6px; padding-block: 10px; overflow-x: auto; }
  .tab { flex: none; padding: 8px 14px; border-radius: 999px; cursor: pointer; border: 1px solid var(--linea); background: var(--card); font: inherit; font-size: .95rem; font-weight: 600; color: var(--acento); }
  .tab.activa { background: var(--acento-fondo); color: var(--sobre-acento); border-color: var(--acento-fondo); }
  .tab.nueva { border-style: dashed; }
  .tab .n { opacity: .65; font-size: .8rem; margin-left: 4px; font-weight: 500; }

  main { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .aviso { background: var(--aviso-bg); border: 1px solid var(--aviso-borde); border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
  .estado { text-align: center; color: var(--suave); padding: 40px 16px; }
  .estado h2 { font-family: var(--serif); color: var(--acento); margin: 0 0 8px; }

  .tabla-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--linea); }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--linea); text-align: left; vertical-align: middle; }
  th { background: var(--fila-cat); color: var(--acento); font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
  td.precio, th.c-precio { text-align: right; width: 130px; }
  td.precio { font-variant-numeric: tabular-nums; font-weight: 700; }
  td.mayo { background: var(--mayo); }
  td.mino { background: var(--mino); }
  td.sin { color: var(--suave); font-weight: 400; opacity: .6; }
  td.nota { color: var(--suave); font-size: .9rem; text-align: center; }
  th.c-nota { text-align: center; }
  td.nota input { text-align: center; }
  #tabla.sin-notas .c-nota, #tabla.sin-notas td.nota { display: none; }
  .sub { display: block; color: var(--suave); font-size: .78rem; font-weight: 400; margin-top: 2px; }
  tr.cat-fila td { background: var(--fila-cat); color: var(--acento); font-family: var(--serif); font-weight: 700; font-size: 1.05rem; }
  .orden { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
  .orden .flecha { opacity: .45; }
  .orden.activo .flecha { opacity: 1; }

  td input, td select { width: 100%; padding: 8px; font: inherit; font-size: 1rem; border: 1px solid var(--linea); border-radius: 8px; background: var(--campo); color: var(--texto); }
  td.precio input { text-align: right; }
  .sub-input { margin-top: 4px; font-size: .85rem; }
  .acc select { margin-bottom: 4px; }
  .c-acc { width: 150px; }
  .btn-fila { padding: 6px 10px; font: inherit; font-size: .9rem; border: 1px solid var(--linea); border-radius: 8px; background: var(--card); color: var(--texto); cursor: pointer; }
  .btn-fila:hover { color: var(--peligro); border-color: var(--peligro); }
  .agregar { margin-top: 14px; }

  body:not(.editando) .solo-edicion { display: none !important; }
  body:not(.puede) .solo-editor { display: none !important; }
  body:not(.bloqueado) .solo-bloqueado { display: none !important; }
  .campo-clave { position: relative; }
  .campo-clave input { padding-right: 46px; }
  input.oculto { -webkit-text-security: disc; }
  .ojo { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--acento); cursor: pointer; padding: 6px 8px; display: flex; }

  .fondo-modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.45); }
  .modal { width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; background: var(--card); color: var(--texto); border-radius: 14px; padding: 20px; box-shadow: 0 10px 40px var(--sombra); }
  .modal h2 { margin: 0 0 6px; font-family: var(--serif); color: var(--acento); font-size: 1.15rem; }
  .modal label { display: block; margin: 12px 0 4px; font-size: .9rem; color: var(--suave); }
  .modal input, .modal select { width: 100%; padding: 10px; font: inherit; font-size: 1rem; border: 1px solid var(--linea); border-radius: 10px; background: var(--campo); color: var(--texto); }
  .modal .nota-chica { font-size: .85rem; color: var(--suave); }
  .modal .pie { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .cat-item { display: flex; gap: 6px; margin-bottom: 6px; }
  .cat-item input { flex: 1; min-width: 0; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 50; text-align: center; }

  @media (max-width: 640px) {
    body { font-size: 16px; }
    .envoltorio { padding-inline: max(8px, env(safe-area-inset-left, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
    header.barra .envoltorio { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
    .tabs { padding-inline: 8px; }
    /* Vista: la misma tabla que en la computadora */
    body:not(.editando) th, body:not(.editando) td { padding: 8px 6px; }
    body:not(.editando) th { font-size: .64rem; letter-spacing: 0; }
    body:not(.editando) th.c-precio, body:not(.editando) td.precio { width: auto; }
    body:not(.editando) th.c-nota, body:not(.editando) td.nota { width: 1%; font-size: .72rem; line-height: 1.2; white-space: nowrap; }
    body:not(.editando) td.nombre { font-size: .9rem; line-height: 1.25; overflow-wrap: anywhere; }
    body:not(.editando) td.precio { font-size: .8rem; white-space: nowrap; }
    /* Edición: cada producto como tarjeta */
    body.editando table, body.editando thead, body.editando tbody, body.editando tr, body.editando td { display: block; }
    body.editando thead { display: none; }
    body.editando tr { padding: 10px 12px; border-bottom: 1px solid var(--linea); }
    body.editando td { border: 0; padding: 2px 0; }
    body.editando td.precio { width: auto; text-align: left; margin: 4px 0; padding: 4px 8px; border-radius: 8px; }
    body.editando td.mayo::before { content: "Mayorista: "; font-weight: 400; font-size: .8rem; }
    body.editando td.mino::before { content: "Minorista: "; font-weight: 400; font-size: .8rem; }
    body.editando td.acc { margin-top: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="barra">
  <div class="envoltorio">
    <div class="titulo"><h1>Lista de Precios</h1><small id="actualizado"></small></div>
    <input id="buscar" type="search" placeholder="Buscar producto…" autocomplete="off" aria-label="Buscar producto">
    <div class="acciones">
      <button id="btnAdmin" class="btn solo-bloqueado" type="button">🔒 Editar</button>
      <button id="btnEditar" class="btn primario solo-editor" type="button">✏️ Editar</button>
      <button id="btnSalir" class="btn solo-editor" type="button">🔓 Cerrar Sesión Editor</button>
      <button id="btnMenu" class="btn solo-editor" type="button">⋯ Más</button>
      <div id="menu" class="menu" hidden>
        <button type="button" data-accion="porcentaje">📈 Ajustar precios por %</button>
        <button type="button" data-accion="categorias">🗂️ Administrar categorías</button>
        <button type="button" data-accion="csv">📄 Descargar para Excel (CSV)</button>
        <button type="button" data-accion="respaldo">💾 Guardar copia de seguridad</button>
        <button type="button" data-accion="restaurar">📂 Restaurar copia de seguridad</button>
        <button type="button" data-accion="reiniciar" style="color:var(--peligro)">♻️ Volver al catálogo original</button>
      </div>
      <input id="archivoRespaldo" type="file" accept=".json" hidden>
    </div>
  </div>
</header>

<div class="envoltorio">
  <nav id="tabs" class="tabs" aria-label="Categorías"></nav>
  <main>
    <p id="aviso" class="aviso" hidden>Modo edición: tocá cualquier campo para cambiarlo. Se guarda solo.</p>
    <div id="estado" class="estado" hidden></div>
    <div class="tabla-scroll" id="contenedorTabla" hidden>
      <table id="tabla">
        <thead>
          <tr>
            <th class="c-nombre"><button type="button" class="orden" data-orden="nombre" title="Ordenar de la A a la Z">Producto <span class="flecha">⇅</span></button></th>
            <th class="c-precio"><button type="button" class="orden" data-orden="mayorista" title="Ordenar por Mayorista">Mayorista <span class="flecha">⇅</span></button></th>
            <th class="c-precio"><button type="button" class="orden" data-orden="minorista" title="Ordenar por Minorista">Minorista <span class="flecha">⇅</span></button></th>
            <th class="c-nota">Comentario</th>
            <th class="c-acc solo-edicion"></th>
          </tr>
        </thead>
        <tbody id="cuerpo"></tbody>
      </table>
    </div>
    <button id="btnAgregar" class="btn primario agregar solo-edicion" type="button">➕ Agregar producto</button>
  </main>
</div>

<div id="modal" class="fondo-modal" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

  const svg = (t) => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t}</svg>`;
  const OJO = svg(`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>`);
  const OJO_TACHADO = svg(`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>`);
  let cats = [];            // [{id, nombre, orden, productos:[{id,nombre,sub,mayorista,minorista,unidad,nota}]}]
  let catActiva = TODAS, busqueda = "", ordenCol = null, ordenDir = "desc";
  let ultimaActualizacion = null, renderPendiente = false;
  const sucias = new Set(), cadenas = new Map(), temporizadores = new Map();

  // ---------- utilidades ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const sinAcentos = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  const clonar = (x) => JSON.parse(JSON.stringify(x));
  function aviso(msg) {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(aviso.t); aviso.t = setTimeout(() => (t.hidden = true), 3200);
  }
  function errorDb(e) {
    const c = e && e.code;
    if (c === "invalid_argument") aviso("No tenés permiso para cambiar la lista.");
    else if (c === "resource_exhausted") aviso("Demasiados cambios seguidos. Esperá un momento.");
    else aviso("No se pudo guardar. Probá de nuevo.");
  }
  function formatearPrecio(valor, unidad) {
    const v = String(valor ?? "").trim();
    if (!v) return "";
    if (/^\d+([.,]\d+)?$/.test(v)) return "$ " + Number(v.replace(",", ".")).toLocaleString("es-AR") + (unidad ? " " + unidad : "");
    return v.replace(/^(\d+)/, (n) => "$ " + Number(n).toLocaleString("es-AR"));
  }
  function valorNumerico(v) {
    const m = String(v ?? "").trim().match(/^\d+([.,]\d+)?/);
    return m ? Number(m[0].replace(",", ".")) : null;
  }
  const catPorId = (id) => cats.find((c) => c.id === id);
  const nombresCats = () => cats.map((c) => c.nombre);

  // ---------- modal propio (no hay alert/confirm en el visor) ----------
  function abrirModal(html) { $("modal").innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; $("modal").hidden = false; }
  function cerrarModal() { $("modal").hidden = true; $("modal").innerHTML = ""; }
  function confirmar(titulo, texto, textoBoton) {
    return new Promise((res) => {
      abrirModal(`<h2>${esc(titulo)}</h2><p>${esc(texto)}</p><div class="pie"><button class="btn" id="cfNo" type="button">Cancelar</button><button class="btn primario" id="cfSi" type="button">${esc(textoBoton || "Aceptar")}</button></div>`);
      $("cfNo").onclick = () => { cerrarModal(); res(false); };
      $("cfSi").onclick = () => { cerrarModal(); res(true); };
    });
  }
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) { cerrarModal(); if (!editando) renderTabla(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) { cerrarModal(); renderTabla(); } });

  // ---------- escritura ----------
  // Cada categoría es un documento con la lista de sus productos. Se escribe de a una por vez.
  function guardarCat(c, inmediato) {
    sucias.add(c.id);
    clearTimeout(temporizadores.get(c.id));
    const ir = () => {
      temporizadores.delete(c.id);
      const productos = clonar(c.productos);
      const previa = cadenas.get(c.id) || Promise.resolve();
      cadenas.set(c.id, previa
        .then(() => db.doc("categorias/" + c.id).update({ productos, actualizado: new Date().toISOString() }))
        .catch(errorDb)
        .then(() => { if (!temporizadores.has(c.id)) sucias.delete(c.id); }));
    };
    if (inmediato) ir(); else temporizadores.set(c.id, setTimeout(ir, 500));
  }
  function nuevaCatDoc(nombre) {
    const orden = cats.reduce((m, c) => Math.max(m, c.orden || 0), 0) + 1;
    const c = { id: "c" + uid(), nombre, orden, productos: [] };
    cats.push(c);
    db.doc("categorias/" + c.id).set({ nombre, orden, productos: [] }).catch(errorDb);
    return c;
  }
  function unidadPorDefecto(nombreCat) { return nombreCat === "Quesos" || nombreCat === "Fiambres" ? "kg" : "uni"; }

  // ---------- render ----------
  function itemsVisibles() {
    const q = sinAcentos(busqueda.trim());
    let items = cats.flatMap((c) => c.productos.map((p) => ({ p, c })));
    items = items.filter(({ p, c }) =>
      (q || catActiva === TODAS || c.id === catActiva) &&
      (!q || sinAcentos(p.nombre + " " + p.sub + " " + p.nota).includes(q)));
    if (ordenCol === "nombre") {
      // alfabético, sin distinguir mayúsculas ni acentos
      const s = ordenDir === "desc" ? -1 : 1;
      items.sort((a, b) => s * a.p.nombre.localeCompare(b.p.nombre, "es", { sensitivity: "base", numeric: true }));
    } else if (ordenCol) {
      const s = ordenDir === "desc" ? -1 : 1;
      items.sort((a, b) => {
        const x = valorNumerico(a.p[ordenCol]), y = valorNumerico(b.p[ordenCol]);
        if (x === null && y === null) return 0;
        if (x === null) return 1;
        if (y === null) return -1;
        return (x - y) * s;
      });
    }
    return items;
  }
  function filaVista({ p }) {
    const celda = (v, cls) => { const f = formatearPrecio(v, p.unidad); return `<td class="precio ${cls}${f ? "" : " sin"}">${f || "—"}</td>`; };
    return `<tr><td class="nombre">${esc(p.nombre)}${p.sub ? `<small class="sub">${esc(p.sub)}</small>` : ""}</td>${celda(p.mayorista, "mayo")}${celda(p.minorista, "mino")}<td class="nota">${esc(p.nota)}</td></tr>`;
  }
  function filaEdicion({ p, c }) {
    const optCat = cats.map((x) => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${esc(x.nombre)}</option>`).join("") + `<option value="${NUEVA}">➕ Nueva categoría…</option>`;
    return `<tr data-c="${c.id}" data-p="${p.id}">
      <td class="nombre"><input data-campo="nombre" value="${esc(p.nombre)}" placeholder="Producto" aria-label="Producto"><input class="sub-input" data-campo="sub" value="${esc(p.sub)}" placeholder="Sub descripción (opcional)" aria-label="Sub descripción"></td>
      <td class="precio mayo"><input data-campo="mayorista" value="${esc(p.mayorista)}" placeholder="Mayorista" aria-label="Precio mayorista"></td>
      <td class="precio mino"><input data-campo="minorista" value="${esc(p.minorista)}" placeholder="Minorista" aria-label="Precio minorista"></td>
      <td class="nota"><input data-campo="nota" value="${esc(p.nota)}" placeholder="Comentario" aria-label="Comentario"></td>
      <td class="acc solo-edicion">
        <select data-campo="categoria" aria-label="Categoría">${optCat}</select>
        <select data-campo="unidad" aria-label="Se vende por"><option value="kg" ${p.unidad === "kg" ? "selected" : ""}>por kg</option><option value="uni" ${p.unidad === "uni" ? "selected" : ""}>por unidad</option></select>
        <button class="btn-fila" type="button" data-borrar="1" aria-label="Eliminar producto">🗑️ Eliminar</button>
      </td></tr>`;
  }
  function renderTabs() {
    const total = cats.reduce((n, c) => n + c.productos.length, 0);
    const t = [`<button class="tab ${catActiva === TODAS ? "activa" : ""}" type="button" data-cat="${TODAS}">Todas<span class="n">${total}</span></button>`]
      .concat(cats.map((c) => `<button class="tab ${catActiva === c.id ? "activa" : ""}" type="button" data-cat="${c.id}">${esc(c.nombre)}<span class="n">${c.productos.length}</span></button>`));
    if (editando) t.push(`<button class="tab nueva" type="button" data-nueva="1">➕ Nueva categoría</button>`);
    $("tabs").innerHTML = t.join("");
  }
  function renderOrden() {
    document.querySelectorAll(".orden").forEach((b) => {
      const act = b.dataset.orden === ordenCol;
      b.classList.toggle("activo", act);
      if (b.dataset.orden === "nombre") {

        b.title = !act ? "Ordenar de la A a la Z" : ordenDir === "asc" ? "De la A a la Z (tocá para invertir)" : "De la Z a la A (tocá para quitar el orden)";
        return;
      }
      b.querySelector(".flecha").textContent = !act ? "⇅" : ordenDir === "desc" ? "▼" : "▲";
      b.title = !act ? "Ordenar de mayor a menor" : ordenDir === "desc" ? "De mayor a menor (tocá para invertir)" : "De menor a mayor (tocá para quitar el orden)";
    });
  }
  function renderTabla() {

  function pedirRender() {

  $("buscar").addEventListener("input", (e) => { busqueda = e.target.value; renderTabla(); });
  $("tabs").addEventListener("click", (e) => {

  $("cuerpo").addEventListener("change", (e) => {

  $("cuerpo").addEventListener("click", async (e) => {
    if (!e.target.closest("[data-borrar]")) return;
    const tr = e.target.closest("tr"), c = catPorId(tr.dataset.c); if (!c) return;
    const p = c.productos.find((x) => x.id === tr.dataset.p); if (!p) return;

  function moverProducto(idOrigen, idProd, idDestino) {
    const o = catPorId(idOrigen), d = catPorId(idDestino); if (!o || !d || o === d) return renderTabla();
    const i = o.productos.findIndex((x) => x.id === idProd); if (i < 0) return;

  // ---------- nueva categoría ----------
  function dialogoNuevaCat(mover) {
    abrirModal(`<h2>Nueva categoría</h2><label for="ncNombre">Nombre</label><input id="ncNombre" placeholder="Ej: Bebidas" autocomplete="off"><div class="pie"><button class="btn" id="ncNo" type="button">Cancelar</button><button class="btn primario" id="ncSi" type="button">Crear</button></div>`);

      const c = nuevaCatDoc(nombre);

  function dialogoPorcentaje() {
    abrirModal(`<h2>Ajustar precios por %</h2>
      <label for="pct">Porcentaje (negativo para bajar, ej: -5)</label><input id="pct" type="number" step="0.1" placeholder="Ej: 10">
      <label for="pctCat">Aplicar a</label><select id="pctCat"><option value="${TODAS}">Todas las categorías</option>${cats.map((c) => `<option value="${c.id}" ${c.id === catActiva ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}</select>
      <label for="pctCol">Columna</label><select id="pctCol"><option value="ambas">Mayorista y Minorista</option><option value="mayorista">Solo Mayorista</option><option value="minorista">Solo Minorista</option></select>
      <label for="pctRed">Redondear a</label><select id="pctRed"><option value="10">Múltiplo de $10</option><option value="50">Múltiplo de $50</option><option value="1">Sin redondear</option></select>
      <p class="nota-chica">Se cambia el primer número de cada precio. Los productos sin precio no se tocan.</p>
      <div class="pie"><button class="btn" id="pctNo" type="button">Cancelar</button><button class="btn primario" id="pctSi" type="button">Aplicar</button></div>`);
    $("pctNo").onclick = cerrarModal;
    $("pctSi").onclick = () => {
      const pct = parseFloat($("pct").value);
      if (!isFinite(pct) || pct === 0) return aviso("Escribí un porcentaje.");
      const cat = $("pctCat").value, col = $("pctCol").value, red = Number($("pctRed").value);
      const ajustar = (v) => String(v ?? "").replace(/^\d+([.,]\d+)?/, (n) => String(Math.round(Number(n.replace(",", ".")) * (1 + pct / 100) / red) * red));
      let cambios = 0;
      cats.forEach((c) => {
        if (cat !== TODAS && c.id !== cat) return;
        let toco = false;
        c.productos.forEach((p) => ["mayorista", "minorista"].forEach((k) => {
          if (col !== "ambas" && col !== k) return;
          const n = ajustar(p[k]); if (n !== p[k]) { p[k] = n; cambios++; toco = true; }
        }));

  function dialogoCategorias() {
    const copia = cats.map((c) => ({ id: c.id, nombre: c.nombre }));
    const dibujar = () => {
      abrirModal(`<h2>Categorías</h2><div>${copia.map((c, i) => `<div class="cat-item"><input data-i="${i}" value="${esc(c.nombre)}" aria-label="Nombre de la categoría"><button class="btn-fila" type="button" data-sube="${i}" title="Subir">⬆️</button><button class="btn-fila" type="button" data-baja="${i}" title="Eliminar">🗑️</button></div>`).join("")}</div>

      const nombres = copia.map((c) => c.nombre.trim());

      if (new Set(nombres.map(sinAcentos)).size !== nombres.length) return aviso("Hay categorías repetidas.");
      const vivas = new Set(copia.map((c) => c.id));
      try {
        for (const c of cats.filter((x) => !vivas.has(x.id))) await db.doc("categorias/" + c.id).delete();
        for (let i = 0; i < copia.length; i++) {

      cerrarModal(); renderTabla(); aviso("Categorías guardadas.");
    }
    dibujar();
  }

  // ---------- candado del editor ----------
  async function hashear(texto) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("manantial:" + texto));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  function desbloqueado() { try { return localStorage.getItem(CLAVE_EDITOR) === HASH_EDITOR; } catch (e) { return false; } }
  function aplicarModo() {
    puedeEditar = esEditor && desbloqueado();
    document.body.classList.toggle("puede", puedeEditar);
    document.body.classList.toggle("bloqueado", esEditor && !puedeEditar);
    if (!puedeEditar && editando) {
      editando = false; document.body.classList.remove("editando");

  function pedirClave() {

    $("clave").focus();
    const entrar = async () => {
      try {
        if ((await hashear($("clave").value)) !== HASH_EDITOR) { $("clave").value = ""; return aviso("Contraseña incorrecta."); }
        localStorage.setItem(CLAVE_EDITOR, HASH_EDITOR);
      } catch (e) { return aviso("No se pudo verificar la contraseña en este navegador."); }
      cerrarModal(); aplicarModo(); aviso("Modo editor activado.");
    };
    // se verifica mientras escribe: si es correcta, el cartel se cierra solo
    $("clave").oninput = async () => { try { if ((await hashear($("clave").value)) === HASH_EDITOR) entrar(); } catch (e) { /* se verifica con Entrar */ } };
    $("ojo").onclick = () => {
      const oculta = $("clave").classList.toggle("oculto");
      $("ojo").innerHTML = oculta ? OJO : OJO_TACHADO;

  // ---------- restaurar y volver al catálogo original ----------
  function normalizarRespaldo(d) {
    const txt = (x) => String(x ?? "");
    const prod = (p) => ({ id: p.id ? txt(p.id) : "p" + uid(), nombre: txt(p.nombre), sub: txt(p.sub), mayorista: txt(p.mayorista), minorista: txt(p.minorista), unidad: p.unidad === "kg" ? "kg" : "uni", nota: txt(p.nota) });
    if (!d || !Array.isArray(d.categorias) || !d.categorias.length) return null;
    if (typeof d.categorias[0] === "object") {            // copia de esta página
      return d.categorias.map((c) => ({ nombre: txt(c.nombre), productos: (c.productos || []).map(prod) }));
    }
    if (Array.isArray(d.productos)) {                      // copia de la versión de archivo (index.html)
      return d.categorias.map((n) => ({ nombre: txt(n), productos: d.productos.filter((p) => p.categoria === n).map(prod) }));
    }
    return null;
  }
  async function reemplazarCatalogo(lista) {
    temporizadores.forEach((t) => clearTimeout(t)); temporizadores.clear();
    try {
      await Promise.all([...cadenas.values()]);
      const existentes = new Map(cats.map((c) => [sinAcentos(c.nombre), c]));
      const usados = new Set();
      for (let i = 0; i < lista.length; i++) {
        const n = lista[i], ex = existentes.get(sinAcentos(n.nombre)), id = ex ? ex.id : "c" + uid();
        usados.add(id);
        await db.doc("categorias/" + id).set({ nombre: n.nombre, orden: i + 1, productos: n.productos, actualizado: new Date().toISOString() });
      }
      for (const c of cats) if (!usados.has(c.id)) await db.doc("categorias/" + c.id).delete();
      sucias.clear(); catActiva = TODAS;
      aviso("Lista restaurada.");
    } catch (e) { errorDb(e); }
  }
  $("archivoRespaldo").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f || !puedeEditar) return;
    let lista = null;
    try { lista = normalizarRespaldo(JSON.parse(await f.text())); } catch (err) { lista = null; }
    if (!lista) return aviso("El archivo no es una copia de seguridad válida.");
    if (await confirmar("Restaurar copia de seguridad", "Esto reemplaza la lista actual por la de la copia. ¿Continuar?", "Restaurar")) reemplazarCatalogo(lista);
  });
  async function dialogoReiniciar() {
    if (await confirmar("Volver al catálogo original", "Esto borra TODOS los cambios y vuelve al catálogo original del cuaderno. ¿Seguro?", "Volver al original")) reemplazarCatalogo(clonar(CATALOGO_ORIGINAL));
  }

  // ---------- descargas ----------
  async function descargar(nombre, contenido) {
    if (!descargas) return aviso("Descargar no está disponible en esta vista.");
    try { await descargas.save({ filename: nombre, data: contenido }); aviso("Archivo guardado."); }
    catch (e) { if (e && e.code !== "declined") aviso("No se pudo descargar el archivo."); }
  }
  const fechaArchivo = () => new Date().toISOString().slice(0, 10);
  function descargarCSV() {
    const celda = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const filas = [["Categoría", "Producto", "Sub descripción", "Mayorista", "Minorista", "Unidad", "Comentario"]];
    cats.forEach((c) => c.productos.forEach((p) => filas.push([c.nombre, p.nombre, p.sub, p.mayorista, p.minorista, p.unidad, p.nota])));
    descargar(`lista-precios-${fechaArchivo()}.csv`, "﻿" + filas.map((f) => f.map(celda).join(";")).join("\r\n"));
  }
  function descargarRespaldo() {
    descargar(`respaldo-lista-${fechaArchivo()}.json`, JSON.stringify({ categorias: cats }, null, 2));
  }

  // ---------- arranque ----------
  function mostrarSinAcceso() {
    $("estado").hidden = false;
    $("estado").innerHTML = `<h2>Iniciá sesión para ver la lista</h2><p>Esta lista se abre con una cuenta de Claude que tenga acceso.</p>`;
  }
  (async () => {
    renderTabs();
    $("estado").hidden = false; $("estado").innerHTML = `<p>Cargando lista…</p>`;
    try {
      const [d, u, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
      db = d; descargas = dl;
      esEditor = u ? await u.canEdit() : false;
    } catch (e) { db = null; }
    aplicarModo();
    if (!db) return mostrarSinAcceso();
    db.collection("categorias").onSnapshot((snap) => {
      const previas = new Map(cats.map((c) => [c.id, c]));
      ultimaActualizacion = snap.docs.reduce((m, d) => { const a = (d.data() || {}).actualizado; return a && (!m || a > m) ? a : m; }, ultimaActualizacion);
      cats = snap.docs.map((d) => {
        if (sucias.has(d.id) && previas.has(d.id)) return previas.get(d.id); // hay cambios propios sin confirmar
        const x = d.data() || {};
        return { id: d.id, nombre: x.nombre || "", orden: x.orden || 0, productos: clonar(x.productos || []) };
      });
      for (const [id, c] of previas) if (sucias.has(id) && !cats.some((k) => k.id === id)) cats.push(c);
      cats.sort((a, b) => a.orden - b.orden);
      if (catActiva !== TODAS && !catPorId(catActiva)) catActiva = TODAS;
      cargado = true;
      $("estado").hidden = true;
      pedirRender();
    }, () => { cargado = false; mostrarSinAcceso(); });
  })();
})();
</script>
